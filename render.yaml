services:
  # Django Web Service (Daphne ASGI for WebSocket support)
  - type: web
    name: mcq-quiz-platform
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT quiz_platform.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "quiz_platform.settings.production"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: REDIS_URL
        fromService:
          name: mcq-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # Redis for Django Channels (WebSocket layer)
  - type: redis
    name: mcq-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
