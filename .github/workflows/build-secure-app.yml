name: Build Secure Exam Browser

on:
  push:
    branches:
      - main
    paths:
      - 'secure-app/**'
      - '.github/workflows/build-secure-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: secure-app/package-lock.json

      - name: Install dependencies
        working-directory: secure-app
        run: npm ci || npm install

      - name: Build macOS Application (.dmg and .zip)
        working-directory: secure-app
        run: npm run build:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureApp-macOS
          path: secure-app/dist/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: secure-app/package-lock.json

      - name: Install dependencies
        working-directory: secure-app
        run: npm ci || npm install

      - name: Build Windows Application (.exe)
        working-directory: secure-app
        run: npm run build:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureApp-Windows
          path: secure-app/dist/*.exe
          if-no-files-found: warn

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-artifacts/

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if release exists..."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Secure Exam Browser v1.0.0" --notes "Official proctored examination client binaries with Isolated Kiosk Sandbox, Anti-VM, Anti-RDP, and Ephemeral Ed25519 Cryptographic Attestation."
          fi
          echo "Uploading assets with --clobber overwrite..."
          gh release upload latest release-artifacts/* --clobber

