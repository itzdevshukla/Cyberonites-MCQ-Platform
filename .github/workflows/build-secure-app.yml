name: Build Secure Exam Browser

on:
  push:
    paths:
      - 'secure-app/**'
      - '.github/workflows/build-secure-app.yml'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: secure-app/package-lock.json

      - name: Install dependencies
        working-directory: secure-app
        run: npm ci || npm install

      - name: Build macOS Application (.dmg and .zip)
        working-directory: secure-app
        run: npm run build:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureApp-macOS
          path: secure-app/dist/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: secure-app/package-lock.json

      - name: Install dependencies
        working-directory: secure-app
        run: npm ci || npm install

      - name: Build Windows Application (.exe)
        working-directory: secure-app
        run: npm run build:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureApp-Windows
          path: secure-app/dist/*.exe
          if-no-files-found: warn
