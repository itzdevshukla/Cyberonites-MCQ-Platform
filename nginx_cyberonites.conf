server {
    listen 80;
    server_name qarena.abhirajsinghchauhan.in abhirajsinghchauhan.in www.abhirajsinghchauhan.in _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name qarena.abhirajsinghchauhan.in abhirajsinghchauhan.in www.abhirajsinghchauhan.in _;

    ssl_certificate /etc/letsencrypt/live/qarena.abhirajsinghchauhan.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qarena.abhirajsinghchauhan.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 150M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Connection limit per IP
    limit_conn conn_limit 30;

    # Static files
    location /static/ {
        alias /var/www/cyberonites/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Media files (Secure Browser .exe and .dmg binaries)
    location /media/ {
        alias /var/www/cyberonites/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Real-Time WebSocket Streaming (Proctoring Deck & Screen Stream - NO RATE LIMIT)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Anti-Brute Force Protection for Login
    location /accounts/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Anti-Brute Force Protection for Fortified Secret Admin Access
    location ~ ^/byteviper_hackvajra_bitty_bold_shadow_cache {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Strict Block: Obsolete Admin Login URL
    location = /accounts/admin-login/ {
        return 404;
    }


    # Standard Application Traffic with General Rate Limiting
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
