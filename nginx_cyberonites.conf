# Nginx Request Queuing & Burst Protection for High Concurrency (200+ users)
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

server {
    listen 80;
    server_name abhirajsinghchauhan.in www.abhirajsinghchauhan.in _;

    client_max_body_size 50M;

    # Maximum 60 simultaneous connections per IP
    limit_conn conn_limit_per_ip 60;

    # Static files
    location /static/ {
        alias /var/www/cyberonites/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files
    location /media/ {
        alias /var/www/cyberonites/media/;
    }

    # Asynchronous WebSockets
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTTP App traffic with Request Queueing (burst=150)
    location / {
        limit_req zone=req_limit_per_ip burst=150 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
