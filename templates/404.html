<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found — Cyberonites</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #0a0a1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
                border-radius: 16px; padding: 3rem; text-align: center; max-width: 420px; }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { font-size: 3.5rem; background: linear-gradient(135deg, #00f0ff, #7b2fff);
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        h4 { margin-bottom: 1rem; }
        p { color: #888; margin-bottom: 1.5rem; }
        a { display: inline-block; padding: 0.7rem 1.5rem; background: linear-gradient(135deg, #00f0ff, #7b2fff);
            color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🛰️</div>
        <h1>404</h1>
        <h4>Cyber Target Not Found</h4>
        <p>The requested URL or resource does not exist or has been removed from the platform.</p>
        <a href="/">Return to Home</a>
    </div>
</body>
</html>
